  Turn a teapot with the Adafruit CLUE, over Web Bluetooth. Serve this
  directory over http on localhost, see the README.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLUE Teapot</title>
<style>
  :root {
    --stage-top: #dfe5ee;
    --stage-bottom: #b9c3d3;
    --ink: #1b2433;
    --muted: #5d6a80;
    --line: #c3ccda;
    --panel: #f4f6fa;
    --glaze: #2c4ea8;
    --live: #c47d22;
    --bad: #b33a3a;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --stage-top: #1d2533;
      --stage-bottom: #0e131c;
      --ink: #e4e9f2;
      --muted: #93a0b6;
      --line: #2f3a4d;
      --panel: #161d29;
      --glaze: #6f8fe6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 10px;
  }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  #state { color: var(--muted); font-size: 0.9rem; text-align: right; }
  #state.live { color: var(--live); }
  #state.bad { color: var(--bad); }
  .stage {
    position: relative;
    margin: 0 16px;
    border-radius: var(--radius);
    background: linear-gradient(var(--stage-top), var(--stage-bottom));
    aspect-ratio: 1 / 1;
    max-height: 62vh;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .angles {
    position: absolute;
    left: 12px;
    bottom: 10px;
    display: flex;
    gap: 14px;
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .angles b { color: var(--ink); font-weight: 600; }
  .keys { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 6px; }
  .key {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--muted);
    display: grid; place-items: center;
    font-size: 0.75rem; color: var(--muted);
  }
  .key.down { background: var(--live); border-color: var(--live); color: #fff; }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 16px 6px;
  }
  button, select {
    font: inherit;
    font-size: 0.95rem;
    padding: 11px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    min-height: 44px;
  }
  button.primary { background: var(--glaze); border-color: var(--glaze); color: #fff; font-weight: 600; }
  button:disabled, select:disabled { opacity: 0.45; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--live); outline-offset: 2px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--line); font-weight: 600; }
  details { padding: 4px 16px 18px; color: var(--muted); font-size: 0.88rem; }
  summary { cursor: pointer; padding: 6px 0; }
  .raw { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .raw span:nth-child(4n + 1) { color: var(--ink); }
  p.hint { margin: 4px 16px 0; color: var(--muted); font-size: 0.85rem; line-height: 1.45; max-width: 60ch; }
  @media (min-width: 760px) {
    body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / -1; }
    .stage { aspect-ratio: auto; max-height: none; height: calc(100vh - 76px); margin-bottom: 16px; }
    .side { display: flex; flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <h1>CLUE Teapot</h1>
  <div id="state" role="status">Not connected</div>
</header>
<div class="stage">
  <canvas id="view" aria-label="A teapot turned by the board"></canvas>
  <div class="angles" aria-live="off">
    <span>roll <b id="roll">0</b></span>
    <span>pitch <b id="pitch">0</b></span>
    <span>yaw <b id="yaw">0</b></span>
    <span><b id="hz">0</b> Hz</span>
  </div>
  <div class="keys"><span class="key" id="key-a">A</span><span class="key" id="key-b">B</span></div>
</div>
<div class="side">
  <div class="controls">
    <button id="connect" class="primary">Connect</button>
    <button id="demo">Try without a board</button>
    <button id="recenter" disabled>Recenter</button>
    <div class="seg" role="group" aria-label="Sensors used">
      <button id="axes6" aria-pressed="true" disabled>6 axes</button>
      <button id="axes9" aria-pressed="false" disabled>9 axes</button>
    </div>
    <select id="rate" disabled aria-label="Updates per second">
      <option value="25">25 updates/s</option>
      <option value="50" selected>50 updates/s</option>
      <option value="100">100 updates/s</option>
    </select>
    <button id="calibrate" disabled>Calibrate gyro</button>
  </div>
  <p class="hint" id="hint">Press Connect and pick "CLUE Motion". Keep the board still on
    the table for 2 seconds after it starts. Button A on the board recenters too.</p>
  <details id="raw-box">
    <summary>Raw sensors</summary>
    <div class="raw">
      <span>accel g</span><span id="ax">-</span><span id="ay">-</span><span id="az">-</span>
      <span>gyro deg/s</span><span id="gx">-</span><span id="gy">-</span><span id="gz">-</span>
    </div>
  </details>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { TeapotGeometry } from "./vendor/three/TeapotGeometry.js";
import * as P from "./protocol.js";

const $ = (id) => document.getElementById(id);

// --- rendering ------------------------------------------------------------

const canvas = $("view");
let draw = () => {};

function setupScene() {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
  camera.position.set(0, 1.5, 5.6);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4560, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-2.5, 5, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.radius = 6;
  Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 15 });
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.6);
  fill.position.set(3, 1, -2);
  scene.add(fill);

  // a glazed teapot: the Utah teapot of three.js, about 1.4 units high
  const glaze = getComputedStyle(document.documentElement).getPropertyValue("--glaze").trim();
  const material = new THREE.MeshPhysicalMaterial({
    color: glaze, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.06,
    side: THREE.DoubleSide,
  });
  const teapot = new THREE.Mesh(new TeapotGeometry(0.68, 16), material);
  teapot.castShadow = true;
  const holder = new THREE.Group();
  holder.add(teapot);
  scene.add(holder);

  // only the shadow of the floor is drawn, over the background of the page
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12),
    new THREE.ShadowMaterial({ opacity: 0.22 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.9;
  floor.receiveShadow = true;
  scene.add(floor);

  draw = ([w, x, y, z]) => {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (canvas.width !== Math.round(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.round(height * renderer.getPixelRatio())) {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    holder.quaternion.set(x, y, z, w);
    renderer.render(scene, camera);
  };
}

try {
  setupScene();
}
catch (e) {
  $("hint").textContent = `The teapot cannot be drawn in this browser: ${e.message}`;
}

// --- state ----------------------------------------------------------------

let q = [1, 0, 0, 0];
let chars = null;
let device = null;
let busy = Promise.resolve();
let demo = false;
let received = [];
let hasMag = false;

function setState(text, kind = "") {
  $("state").textContent = text;
  $("state").className = kind;
}

function showAngles() {
  const e = P.euler(q);
  $("roll").textContent = e.roll.toFixed(0);
  $("pitch").textContent = e.pitch.toFixed(0);
  $("yaw").textContent = e.yaw.toFixed(0);
  const now = performance.now();
  received = received.filter((t) => now - t < 1000);
  $("hz").textContent = received.length;
}

function frame(t) {
  if (demo) {
    // a slow wobble and a turn, in the axes of the board
    const s = t / 1000;
    const half = (deg) => (deg * Math.PI) / 360;
    const r = half(28 * Math.sin(0.9 * s));
    const p = half(18 * Math.sin(0.6 * s + 1));
    const y = half(35 * s);
    const qx = [Math.cos(r), Math.sin(r), 0, 0];
    const qy = [Math.cos(p), 0, Math.sin(p), 0];
    const qz = [Math.cos(y), 0, 0, Math.sin(y)];
    q = qmul(qz, qmul(qy, qx));
    received.push(performance.now());
  }
  draw(P.toScene(q));
  showAngles();
  requestAnimationFrame(frame);
}

function qmul([aw, ax, ay, az], [bw, bx, by, bz]) {
  return [aw * bw - ax * bx - ay * by - az * bz, aw * bx + ax * bw + ay * bz - az * by,
    aw * by - ax * bz + ay * bw + az * bx, aw * bz + ax * by - ay * bx + az * bw];
}

function write(data) {
  if (!chars) return;
  busy = busy.then(() => chars.control.writeValueWithResponse(data))
    .catch((e) => setState(e.message, "bad"));
}

function setAxes(axes) {
  $("axes6").setAttribute("aria-pressed", String(axes === 6));
  $("axes9").setAttribute("aria-pressed", String(axes === 9));
}

function enable(on) {
  for (const id of ["recenter", "axes6", "rate", "calibrate"]) $(id).disabled = !on;
  $("axes9").disabled = !on || !hasMag;
}

function onMotion(event) {
  const m = P.decodeMotion(event.target.value);
  q = m.q;
  received.push(performance.now());
  $("key-a").classList.toggle("down", m.buttonA);
  $("key-b").classList.toggle("down", m.buttonB);
  const nineAxes = $("axes9").getAttribute("aria-pressed") === "true";
  if (m.calibrating) setState("Keep the board still, calibrating", "live");
  else if (nineAxes && !m.mag) setState("Turn the board around to find north", "live");
  else setState(`Connected to ${device.name}`, "live");
}

function onRaw(event) {
  const r = P.decodeRaw(event.target.value);
  ["ax", "ay", "az"].forEach((id, i) => { $(id).textContent = r.accel[i].toFixed(3); });
  ["gx", "gy", "gz"].forEach((id, i) => { $(id).textContent = r.gyro[i].toFixed(1); });
}

function disconnected() {
  chars = null;
  enable(false);
  setState("Disconnected", "bad");
  $("connect").textContent = "Connect";
}

async function connect() {
  if (!navigator.bluetooth) {
    setState("No Web Bluetooth in this browser: use Chrome or Edge, over https or localhost", "bad");
    return;
  }
  try {
    demo = false;
    setState("Connecting...");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "CLUE Motion" }],
      optionalServices: [P.UUID.service],
    });
    device.addEventListener("gattserverdisconnected", disconnected);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(P.UUID.service);
    chars = {};
    for (const name of ["info", "motion", "raw", "control"]) {
      chars[name] = await service.getCharacteristic(P.UUID[name]);
    }
    const info = P.decodeInfo(await chars.info.readValue());
    if (info.version !== 1) throw new Error(`unknown protocol version ${info.version}`);
    hasMag = info.hasMag;
    $("rate").value = String(info.notifyHz);
    setAxes(info.axes);
    chars.motion.addEventListener("characteristicvaluechanged", onMotion);
    chars.raw.addEventListener("characteristicvaluechanged", onRaw);
    await chars.motion.startNotifications();
    if ($("raw-box").open) await chars.raw.startNotifications();
    enable(true);
    $("connect").textContent = "Reconnect";
    setState(`Connected to ${device.name}`, "live");
  }
  catch (e) {
    chars = null;
    enable(false);
    setState(e.message, "bad");
  }
}

$("connect").addEventListener("click", connect);
$("demo").addEventListener("click", () => {
  demo = !demo;
  $("demo").textContent = demo ? "Stop the demo" : "Try without a board";
  setState(demo ? "Demo, no board" : "Not connected", demo ? "live" : "");
  if (!demo) q = [1, 0, 0, 0];
});
$("recenter").addEventListener("click", () => write(P.encodeRecenter()));
$("calibrate").addEventListener("click", () => write(P.encodeCalibrate()));
$("axes6").addEventListener("click", () => { setAxes(6); write(P.encodeMode(6)); });
$("axes9").addEventListener("click", () => { setAxes(9); write(P.encodeMode(9)); });
$("rate").addEventListener("change", (e) => write(P.encodeRate(Number(e.target.value))));
$("raw-box").addEventListener("toggle", () => {
  if (!chars) return;
  busy = busy.then(() => ($("raw-box").open ? chars.raw.startNotifications()
    : chars.raw.stopNotifications())).catch((e) => setState(e.message, "bad"));
});

if (new URLSearchParams(location.search).has("demo")) $("demo").click();
requestAnimationFrame(frame);
</script>
</body>
</html>
